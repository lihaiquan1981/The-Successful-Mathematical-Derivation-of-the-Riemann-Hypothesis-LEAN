version: v0.4
project:
  name: "Machine-verified spectral and structural theory of doubly reflected systems"
  description: |
    Lean 4 formalization of the unconditional mathematical core of Li Haiquan's
    preprint on a forward-reverse closure approach to the Riemann Hypothesis
    (Zenodo 10.5281/zenodo.22858922; OSF 10.17605/OSF.IO/VGBTP).

    The registered result is an eight-theorem group in three families:
    structural factorization of doubly reflected entire functions through the
    symmetry quotient s ↦ (s − 1/2)², together with the reflection calculus of
    their imaginary parts; a Gaussian heat-kernel spectral limit for
    two-channel orbit energy, including the explicit χAB quadratic-form
    identity and its strict negativity; and an integer-ring Mother-Equation
    spectral certificate (four-mode eigenvalues, phase-transition cliff, and
    eight-dimensional Jet-lift inheritance). A further pair of theorems
    records real-axis positivity and quotient-coordinate zero location for
    Riemann's xi under one named classical premise (ζ < 0 on (0, 1)).

    Six of the eight theorems are fully unconditional. The remaining two carry
    only that classical real-interval input; no unitarity gate and no
    non-real zero-location hypothesis appears in the registered group. The
    heat-kernel theorem is stated over an abstract field-data package (bounded
    measurable field, four centers, center gradients, quadratic remainder
    bound), not over a presupposed reflection orbit or C² smoothness class.
    Detailed theorem-by-theorem status, literature placement, and the
    repository's conditional RH assembly live in Challenge.lean and README.md.
  authors:
    - Li Haiquan
  license: GPL-3.0
  responsible_maintainers:
    - Li Haiquan
classification:
  arxiv:
    - math.CV
    - math.FA
    - math.NT
    - cs.LO
  msc2020:
    - "30D20"
    - "47A10"
    - "11M26"
    - "03B35"
automation:
  methods:
    - method: AI-assisted
      systems:
        - name: Kimi (Moonshot AI)
          role: >
            Proof-code generation and elaboration support for the eleven Lean
            modules; drafting of formalization metadata and report text. All
            outputs were machine-checked by Lean 4.34.0-rc2.
      notes: >
        The eleven modules were produced with the AI system listed above under
        continuous author direction; the mathematical content, the theorem
        selection, and the responsibility for every line rest with the author.
        A fuller account is maintained in Verification_Report.md, pinned at
        the reviewed commit.
review:
  status: author-verified
  notes: >
    Reproduction runs completed with all modules exiting 0; the axiom audit
    shows only [propext, Quot.sound, Classical.choice]. See
    Verification_Report.md and the reproduction records in the repository.
