version: v0.4
project:
  name: Formalized reduction architecture for the Riemann Hypothesis via the Mother Equation unitarity gate
  description: |
    This development is a Lean 4 formalization of the mathematical core of the
    preprint "The Successful Mathematical Derivation of the Forward-Reverse
    Reversible Bidirectional Closure of the Riemann Hypothesis" (Li Haiquan),
    assembled as one auditable named-premise conditional chain.

    CONTRIBUTION. The artifact's substantive mathematical content is a group
    of unconditional theorems, each machine-proved with zero sorry under the
    three standard axioms: Theorem 9.3A (structural reduction: every
    double-reflection entire function admits f(s) = g((s-1/2)^2) with g
    entire and real-coefficient; standalone); Lemma 9.4 (the chi_AB structure
    of v = Im f: double-reflection symmetry of the imaginary part, vanishing
    on both symmetry axes, Cauchy-Riemann nondegenerate gradients, and the
    orbit-gradient identity w = (a,b,a,-b,-a,b,-a,-b)); Lemma 9.5C (heat-kernel
    regularization limit: the rescaled regularized geometric energy converges
    to the K-quadratic form, with strict negative definiteness -(C/2)||W||^2
    on chi_AB configurations); Lemma 11.3 (real-axis positivity of xi,
    positivity of g(w) on w >= 0, and the critical-line lock); and the
    Note 9.5B jet machine (existence of the first nonzero jet order via the
    analytic identity theorem, m-th order pairing laws, orbit m-uniformity).
    Assembled, these yield the conditional statement
    riemann_hypothesis_conditional (RH_xi; companion RH_xi_unconditional):
    under the explicit premise table stated in FORMAL CLAIM, every zero of xi
    off {0, 1} lies on the critical line. The compared Palomar theorem matches
    Final_Assembly (`RH_xi`) and therefore still lists simplicity of zeros as
    an explicit hypothesis; the companion module Final_Assembly_Unconditional
    shows how that hypothesis can be eliminated by an m-jet lift inside the
    same package. Axiom audits across the chain show only [propext,
    Quot.sound, Classical.choice].

    FORMAL CLAIM. Let xi be Riemann's 1859 xi function, xi s = (s (s - 1) / 2) *
    completedRiemannZeta s, whose zeros off {0, 1} are, inside the critical strip,
    exactly the nontrivial zeros of the Riemann zeta function. For a channel
    coupling C > 0 and an entire function g agreeing with xi off {0, 1}, the
    compared theorem states: if g is doubly reflected (g (1 - s) = g s and
    g (star s) = star (g s)), has only simple zeros, satisfies the unitarity
    gate SatisfiesUnitarity C g (strictly positive energy of the forced four
    point orbit gradient at every zero of g with Re s != 1/2 and Im s != 0,
    which the paper classifies as the non-real off-critical-line zero
    configurations), and zeta is negative on the real interval (0, 1), then
    every zero of xi off {0, 1} lies on the critical line Re s = 1/2. Under the
    classical zero correspondence inside the critical strip this statement
    corresponds to the standard Riemann Hypothesis.

    SCOPE AND GAP. GATE DESIGN NOTE. The unitarity gate is deliberately designed
    so that, on configurations carrying a non-real zero off the critical line,
    its strict-positivity requirement is incompatible with the heat-kernel
    spectral conclusion of Lemma 9.5C (energy -(C/2)||W||^2 < 0). Under the
    remaining hypotheses, every zero the gate targets necessarily violates it:
    the gate acts as an inconsistent-at-counterexamples certificate, and the
    conditional statement is accordingly a reformulation of the zero-location
    conclusion by such a certificate, not an independent substantive reduction.
    The independently substantive mathematical content of the artifact is the
    unconditional theorem group listed in CONTRIBUTION. The unitarity gate and
    the classical input appear as explicit hypotheses and are not discharged
    inside Lean. ENTRY ANCHOR. The three entry conditions of the premise
    table (entireness, Schwarz reflection, multiplier-free central symmetry)
    correspond to structural properties of Riemann's 1859 xi function as
    stated in the original German source, and are not tailored to the target
    conclusion; their discharge for the xi realization is argued in the
    preprint and its appendix (see the Zenodo and OSF records above), not
    inside this Lean artifact. The associated paper argues for the discharge
    in a non formal framework anchored by that source (object reset to xi;
    three interlocking gates; xi does not enter the unitarity repulsion).
    That argument is deliberately outside this artifact. This is therefore a
    machine-checked conditional reduction to a named premise table, not an
    unconditional formal proof of the Riemann Hypothesis.

    EVIDENCE. Eleven modules, zero sorry in the supporting chain, only the three
    standard Lean axioms (propext, Quot.sound, Classical.choice). All modules
    compiled with exit code 0 in an independent third-party reproduction
    (Windows, Lean 4.34.0-rc2, mathlib cache in place), and the sources match a
    committed SHA-256 manifest. A prior Palomar mechanical verification of this
    repository succeeded (Comparator run) before editorial revision of metadata.

    AUDIENCE. Formal verification and analytic number theory: (i) the
    unconditional theorem group (dimension reduction of double-reflection
    entire functions, heat-kernel spectral theory of the two-channel four-point
    orbit kernel, real-axis positivity of xi, m-th order jet machinery) as
    reusable machine-proved lemmas; (ii) a fully auditable conditional statement
    whose explicit premise table isolates precisely the non formal content of a
    proposed solution of the Riemann Hypothesis, with the gate design
    documented as an inconsistent-at-counterexamples certificate.
