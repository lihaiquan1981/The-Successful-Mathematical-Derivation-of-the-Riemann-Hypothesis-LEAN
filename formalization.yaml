version: v0.4
project:
  name: Structural dimension reduction for doubly reflected entire functions (Theorem 9.3A), machine-verified in Lean 4
  description: |
    This development is a Lean 4 formalization of Theorem 9.3A of the preprint
    "The Successful Mathematical Derivation of the Forward-Reverse Reversible
    Bidirectional Closure of the Riemann Hypothesis" (Li Haiquan): every
    entire function f : ℂ → ℂ satisfying the double-reflection symmetry
    f(s) = f(1 − s) and f(conj s) = conj (f s) admits a unique representation
    f(s) = g((s − 1/2)²) with g entire and real-valued on the real axis.

    CONTRIBUTION. The compared theorem structural_reduction_9_3A is an
    unconditional structural result: its only premises are entireness and the
    double-reflection symmetry, and its conclusion — the existence and
    uniqueness of the representing function g — is proved with zero sorry
    under only the three standard Lean axioms (propext, Quot.sound,
    Classical.choice). The theorem has independent mathematical value: it
    reduces the two-dimensional zero-distribution analysis of the whole class
    of doubly reflected entire functions to a one-dimensional entire function
    of a squared variable, and it is the standalone module Theorem_9_3A of
    this repository. The supporting machinery in the proof (Taylor series of
    entire functions, even-part extraction, the identity theorem, and a
    coefficient-reality induction) is classical complex analysis, machine
    checked line by line.

    REPOSITORY EXTENSION. The repository additionally formalizes the
    paper's conditional chain on top of this theorem: Lemma 9.4 (chi_AB
    structure of v = Im f), Lemma 9.5C (heat-kernel regularization limit of
    the two-channel orbit energy), Lemma 11.3 (real-axis positivity of
    Riemann's xi), the m-th order jet generalization (Note 9.5B), and a final
    assembly giving an explicit named-premise conditional statement of the
    Riemann Hypothesis for xi. That chain is an extension of this artifact:
    its unitarity premise is documented in the repository as an
    inconsistent-at-counterexamples certificate, and its discharge is argued
    in the preprint, not inside Lean.

    SCOPE AND GAP. The registered result (structural_reduction_9_3A) is
    unconditional: no unitarity gate, no zero-location hypothesis, and no
    analytic number theory input appears in its statement or proof. The
    repository extension described above is conditional and is not part of
    the compared declaration.

    EVIDENCE. Eleven modules, zero sorry, only the three standard Lean axioms
    (propext, Quot.sound, Classical.choice). All modules compiled with exit
    code 0 in reproduction runs on a separate build environment (Windows,
    Lean 4.34.0-rc2, mathlib cache in place); per-module build logs and a
    committed SHA-256 manifest are in the repository. The prior Palomar
    mechanical verification of this repository succeeded before the metadata
    and comparator revisions described here.

    AUDIENCE. Complex analysis and formal verification: a machine-checked
    structural classification of doubly reflected entire functions (the
    symmetry-forced form f(s) = g((s − 1/2)²)), reusable as a lemma in any
    zero-distribution study of the class, including the conditional Riemann
    Hypothesis chain built on it in the same repository.
