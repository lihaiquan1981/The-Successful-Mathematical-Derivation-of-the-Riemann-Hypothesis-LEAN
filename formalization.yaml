version: v0.4
project:
  name: "Machine-verified spectral and structural theory of doubly reflected systems: eight theorems, zero sorry"
  description: |
    This development is a Lean 4 formalization of an eight-theorem group from
    the preprint "The Successful Mathematical Derivation of the Forward-Reverse
    Reversible Bidirectional Closure of the Riemann Hypothesis" (Li Haiquan,
    Zenodo DOI 10.5281/zenodo.22858922, OSF mirror 10.17605/OSF.IO/VGBTP).
    The group is the complete unconditional, machine-checkable content of the
    preprint: every step below is proved with zero sorry under only the three
    standard Lean axioms (propext, Quot.sound, Classical.choice).

    CONTRIBUTION. Eight declarations:
    (1) structural_reduction_9_3A (Section 9.3A): every entire function f
    with f(s) = f(1 − s) and f(conj s) = conj (f s) factorizes uniquely
    through the symmetry quotient q(s) = (s − 1/2)² as f = g ∘ q, g entire
    and real-valued on the real axis. Status: standard form of the classical
    even-function factorization, independently reproved here in Lean with
    the real-coefficient conclusion extracted by coefficient induction.
    (2) germ_structure_9_4 (Lemma 9.4): the reflection calculus of v = Im f:
    antisymmetry under both reflections, vanishing on both symmetry axes,
    and Cauchy–Riemann nondegeneracy of the real gradient at a simple zero.
    Status: adapted from the classical Cauchy–Riemann identities (Ahlfors,
    Complex Analysis, 3rd ed., Ch. 2) to the double-reflection setting.
    (3) real_axis_positivity_11_3 (Lemma 11.3): xi(x) is a strictly
    positive real for real x ∉ {0, 1}, under the named classical premise hζ
    (zeta strictly negative on (0, 1)). Status: standard classical facts
    (Titchmarsh, The Theory of the Riemann Zeta-Function, Ch. II), assembled
    and machine-checked; hζ is an analytic-number-theory input, not a gate.
    (4) xi_ne_zero_of_quotient_nonneg: zero exclusion on the nonnegative
    part of the quotient range. Status: direct consequence of (3).
    (5) critical_line_lock: if (s − 1/2)² is a negative real then Re s = 1/2.
    Status: quotient-coordinate algebra; the critical line as exact
    preimage. Unconditional.
    (6) heat_kernel_spectral (Lemma 9.5C): stated over an abstract
    field-data structure — an arbitrary finite configuration of four
    evaluation centers s : Fin 4 → ℝ² (the geometric content, the
    reflection orbit of a zero, is the motivation of the preprint's
    Section 9.5 and is deliberately not baked into the data), a measurable
    bounded scalar field Φ, orbit-gradient vectors w, and a pointwise
    quadratic remainder hypothesis htaylor bounding |Φ(sᵢ+u) − wᵢ·u| by
    M·‖u‖². Under these explicit abstract assumptions: (i) the Gaussian
    heat-kernel-regularized bilinear energy E(α)/α converges pointwise
    (α → 0⁺) to the explicit K-quadratic form, via the quantitative
    main-term-plus-remainder decomposition recorded in the repository;
    (ii) on the chi_AB-paired gradient configurations (w(iA) = J_B w,
    w(iB) = J_A w), the exact quantitative identity Kquad C w = −(C/2)·Σᵢ
    ‖wᵢ‖² holds and is part of the compared declaration; (iii) hence the
    limit form is strictly negative definite for C > 0 and nonzero W.
    Status: the two-channel orbit energy has no direct
    precedent in the literature; it is introduced in the preprint, and the
    Gaussian moment framework is standard measure-theoretic probability
    (Durrett, Probability: Theory and Examples, Ch. 3).
    (7) two_channel_kernel_spectrum: in the integer ring with zero mathlib
    dependency, the complete spectral decomposition of the doubled-
    normalization two-channel kernel on the four-point orbit — the four
    Klein-four eigenmodes (trivial, chi_A, chi_B, chi_AB) with their exact
    eigenvalues 2C + 2ε, 2ε, 2ε, −2C + 2ε, the strict sign pattern under
    the intrinsic boundary C > ε > 0, and the phase-transition cliff
    (minimal eigenvalue jump 2C between expanded and collapsed orbits, no
    intermediate state). Status: finite spectral certificate over the
    Klein four-group character table (Serre, Linear Representations of
    Finite Groups, §2.1), machine-closed by decide and ring normalization.
    (8) jet_lift_inheritance: the 8-dimensional gradient-Jet lift of the
    orbit kernel inherits the chi_AB eigenvalue — r8(W8) = (−2C + 2ε)·W8
    for the symmetry-forced gradient pattern W8 = (a, b, a, −b, −a, b, −a, −b),
    with the exact energy identity E8 = 4(a² + b²)(−2C + 2ε) and strict
    negativity on nonzero jets. Status: tensor-lift of the finite
    certificate; the explicit 8×8 integer kernel is normalized and
    machine-closed in the same integer ring.

    RESEARCH CONTEXT. The research significance of the group is the
    significance of what it carries: it is the machine-verified
    load-bearing structure of a formalized conditional proof of the
    Riemann Hypothesis for xi (the repository extension, visible in the
    same repository). Concretely: (1) is the factorization step of that
    chain; (2) supplies the chi_AB gradient algebra that identifies the
    counterexample configurations; (6) is the spectral mechanism by which
    non-real zeros are excluded — the heat-kernel limit is the rigorous
    passage from the delta-kernel energy of the Mother Equation to the
    finite spectral certificate; (3)–(5) are the number-theoretic input and
    the critical-line characterization; (7)–(8) are the symbolic spectral
    core of the gate (four-mode resolution and Jet-lift inheritance),
    machine-closed over the integers. The unconditional content of a
    proposed solution to a Millennium Problem is fully machine-checked;
    the conditional residue (a named unitarity premise and the classical
    input) is isolated, documented, and argued in the preprint.

    SCOPE AND GAP. Declarations (1), (2), (5), (6), (7), and (8) are fully
    unconditional. Declarations (3) and (4) carry one named classical
    premise (hζ) each, matching the preprint's own formulation
    ("combining known classical facts"); hζ is a fact of analytic number
    theory, not a gate on zero configurations. No unitarity premise and no
    zero-location hypothesis appears anywhere in the registered group. The
    field-data structure of (6) carries only the pointwise Taylor-type
    remainder bound stated above — an analysis hypothesis; no orbit
    geometry, smoothness class, or zero assumption is part of the compared
    declaration. The repository extension (the m-th order jet chain and the
    final named-premise assembly) is conditional and is not part of the
    compared declarations.

    EVIDENCE. Eleven modules, zero sorry, only the three standard Lean
    axioms (propext, Quot.sound, Classical.choice). All modules compiled
    with exit code 0 in reproduction runs on a separate build environment
    (Windows, Lean 4.34.0-rc2, mathlib cache in place); per-module build
    logs and a committed SHA-256 manifest are in the repository. Prior
    Palomar mechanical verification of this repository succeeded before
    the metadata and comparator revisions described here.

    AUDIENCE. Researchers in complex analysis, spectral methods, and
    formal verification of analytic number theory: an eight-theorem
    machine-checked group that (a) records the complete unconditional
    content of a formalized approach to the Riemann Hypothesis and (b)
    supplies reusable lemmas (even-function factorization with real
    coefficients, double-reflection gradient calculus, Gaussian-regularized
    energy limits, integer-ring spectral certificates and Jet lifts of Klein-four
    actions) for any energy-method study of reflection-symmetric systems.
